# Deploy only after CI succeeds on main.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout the commit that triggered CI, not the workflow file's default
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The Dockerfile builds VITE_* vars from a BuildKit secret (never baked into a layer).
      # VITE_ENV_FILE must hold the same contents as your local .env.local.
      - run: flyctl deploy --remote-only --build-secret vite_env="$VITE_ENV_FILE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_ENV_FILE: ${{ secrets.VITE_ENV_FILE }}
