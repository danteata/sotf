name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Lint
        # Non-blocking: ~368 pre-existing errors need a dedicated cleanup pass.
        # Remove continue-on-error once that debt is paid down.
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test:run
